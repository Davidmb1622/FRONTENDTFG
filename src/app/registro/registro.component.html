<ion-content>
  <ng-container *ngIf="loginViewFlag">

  <header class="topbar">
    <div class="topbar-container">

      <div class="logo">
        SUITS PEAKS
      </div>

    </div>
  </header>

    <div class="auth-layout">

      <div class="carousel-section">
        <swiper-container
          loop="true"
          autoplay-delay="4000"
          speed="800"
        >
          <swiper-slide>
            <img src="assets/img/carrusel1.jpg" />
          </swiper-slide>

          <swiper-slide>
            <img src="assets/img/carrusel2.jpg" />
          </swiper-slide>

          <swiper-slide>
            <img src="assets/img/carrusel3.jpg" />
          </swiper-slide>
        </swiper-container>
      </div>



      <div class="form-section">

        <form [formGroup]="registroForm" (ngSubmit)="doRegister()">

          <ion-item lines="none">
            <ion-label position="floating">Nombre</ion-label>
            <ion-input formControlName="nombre"></ion-input>
          </ion-item>

          <ion-item lines="none">
            <ion-label position="floating">Correo</ion-label>
            <ion-input formControlName="email"></ion-input>
          </ion-item>

          <ion-item lines="none">
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input type="password" formControlName="password"></ion-input>
          </ion-item>



          <ion-item lines="none">
            <ion-label position="floating">Teléfono</ion-label>
            <ion-input formControlName="telefono"></ion-input>
          </ion-item>

          <ion-button expand="block" class="auth-button" type="submit">
            CREAR
          </ion-button>

        </form>


        <div class="auth-footer">
      <a href="home">¿Ya tienes una cuenta?</a>
    </div>
  </div>
    </div>

</ng-container>

</ion-content>
