<ion-content>
  <main class="contenido">

    <h2 class="titulo-seccion">Novedades</h2>

    <ion-spinner *ngIf="cargando" name="dots"></ion-spinner>
    <p *ngIf="error" class="error">{{ error }}</p>

    <ion-grid>
      <ion-row>
        <ion-col
          size="12"
          size-md="6"
          size-lg="3"
          *ngFor="let producto of novedades"
        >
          <ion-card class="producto-card"  [routerLink]="['/producto', producto.id]">

            <div class="img-wrapper">
              <img [src]="producto.imagenes?.[0]" [alt]="producto.nombre" />
            </div>

            <ion-card-content>
              <span class="tipo">{{ producto.tipo }}</span>
              <h3>{{ producto.nombre }}</h3>
              <p class="descripcion">{{ producto.descripcion }}</p>
              <span class="precio">{{ producto.precio | currency:'EUR' }}</span>
            </ion-card-content>

          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="chat-boton" (click)="toggleChat()">
      💬
    </div>

    <div class="chat-ventana" *ngIf="chatAbierto">

      <div class="chat-header">
        Asistente virtual
        <span (click)="toggleChat()">✖</span>
      </div>

      <div class="chat-mensajes">
        <div *ngFor="let msg of mensajes"
             [class.usuario]="msg.tipo==='user'"
             [class.ia]="msg.tipo==='ia'">

          <div [innerHTML]="msg.texto"></div>

        </div>
      </div>

      <div class="chat-input">

        <input
          [(ngModel)]="mensajeUsuario"
          placeholder="Pregúntame algo..."
          (keyup.enter)="preguntaollama()"
        />

        <button (click)="preguntaollama()">Enviar</button>

      </div>

    </div>

  </main>

</ion-content>
