<ion-content class="auth-page">


  <header class="topbar">
    <div class="topbar-container">

      <div class="logo">
        SUITS PEAKS
      </div>

    </div>
  </header>

  <div class="auth-container">

    <div class="carousel-section">

      <swiper-container
        loop="true"
        autoplay-delay="4000"
        speed="800"
      >
        <swiper-slide>
          <img src="assets/img/carrusel1.jpg" />
        </swiper-slide>

        <swiper-slide>
          <img src="assets/img/carrusel2.jpg" />
        </swiper-slide>

        <swiper-slide>
          <img src="assets/img/carrusel3.jpg" />
        </swiper-slide>
      </swiper-container>

    </div>

    <div class="login-section">
      <div class="login-box">

        <h1>Bienvenido</h1>

        <form [formGroup]="loginForm" (ngSubmit)="doLogin()">

          <ion-item lines="none">
            <ion-label position="floating">Correo</ion-label>
            <ion-input formControlName="email"></ion-input>
          </ion-item>

          <ion-item lines="none">
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input type="password" formControlName="password"></ion-input>
          </ion-item>

          <ion-button expand="block" class="auth-button" type="submit" (click)="doLogin()">
            Iniciar sesión
          </ion-button>

          <ion-button expand="block" class="auth-button" href="registro"> Registrarse </ion-button>
          <div class="guest-link"> <a href="presentacion">Continuar sin cuenta</a> </div>



        </form>

      </div>
    </div>

  </div>


</ion-content>
