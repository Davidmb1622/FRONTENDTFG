<div class="noticias-layout">
  <main class="contenido">

    <div class="noticias-listado">
      <h2 class="titulo-seccion">NOTICIAS</h2>

      <ion-grid>
        <ion-row>
          <ion-col
            size="12"
            size-md="6"
            size-lg="3"
            *ngFor="let noticia of todos"
          >
            <ion-card class="noticias-card">

              <ion-card-content>
                <h3 class="titulo-noticia">{{ noticia.titulo }}</h3>

                <p class="contenido2">
                  {{ noticia.contenido }}
                </p>

                <span class="fecha">
                  {{ noticia.fecha | date:'dd/MM/yyyy' }}
                </span>

              </ion-card-content>

            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>

    </div>

  </main>
</div>
